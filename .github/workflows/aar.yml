# Build the release .aar and publish it to the `maven-repo` branch, which the
# app consumes over raw.githubusercontent (no credentials needed for public
# repos). The aar is the ONLY published artifact — the app never builds Rust.

name: aar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Toolchain (cargo-ndk, uniffi-bindgen)
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.0 --features cli --locked

      - uses: android-actions/setup-android@v3

      - name: Build the aar
        run: ./scripts/build-aar.sh

      - name: Publish to the maven-repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          git config user.name "grouse-roam-core CI"
          git config user.email "actions@github.com"
          # Rebuild the artifacts branch from scratch each publish (idempotent).
          rm -rf "$RUNNER_TEMP/mr"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/mr"
          cd "$RUNNER_TEMP/mr"
          git checkout --quiet maven-repo 2>/dev/null || git checkout --quiet --orphan maven-repo
          git rm -rq --ignore-unmatch . 2>/dev/null || true
          mkdir -p "dev/grouse/roamcore/$VERSION"
          cp "$GITHUB_WORKSPACE/grouse-roam-core-$VERSION.aar" "dev/grouse/roamcore/$VERSION/roamcore-$VERSION.aar"
          cat > "dev/grouse/roamcore/$VERSION/roamcore-$VERSION.pom" <<EOF
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.grouse</groupId>
            <artifactId>roamcore</artifactId>
            <version>$VERSION</version>
            <packaging>aar</packaging>
            <dependencies>
              <dependency>
                <groupId>net.java.dev.jna</groupId>
                <artifactId>jna</artifactId>
                <version>5.14.0</version>
                <type>aar</type>
              </dependency>
            </dependencies>
          </project>
          EOF
          cat > dev/grouse/roamcore/maven-metadata.xml <<EOF
          <metadata>
            <groupId>dev.grouse</groupId>
            <artifactId>roamcore</artifactId>
            <versioning>
              <latest>$VERSION</latest>
              <release>$VERSION</release>
              <versions><version>$VERSION</version></versions>
            </versioning>
          </metadata>
          EOF
          # `git add -f`: *.aar is gitignored in this repo, but the maven-repo
          # branch must carry the artifact.
          git add -f .
          git commit -q -m "publish roamcore $VERSION"
          git push --quiet origin maven-repo
